<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGradient)"/>

  <!-- Geometric Pattern -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Face -->
  <circle cx="200" cy="180" r="80" fill="url(#faceGradient)"/>

  <!-- Hair -->
  <path d="M 120 160 Q 120 100 200 100 Q 280 100 280 160" fill="#1f2937"/>
  <ellipse cx="200" cy="100" rx="80" ry="35" fill="#1f2937"/>

  <!-- Eyes -->
  <circle cx="175" cy="175" r="8" fill="#1f2937"/>
  <circle cx="225" cy="175" r="8" fill="#1f2937"/>
  <circle cx="177" cy="173" r="3" fill="white"/>
  <circle cx="227" cy="173" r="3" fill="white"/>

  <!-- Smile -->
  <path d="M 170 200 Q 200 215 230 200" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>

  <!-- Body/Shoulders -->
  <ellipse cx="200" cy="320" rx="100" ry="80" fill="#2563eb"/>

  <!-- Shirt collar -->
  <path d="M 150 280 L 200 300 L 250 280" fill="white" opacity="0.3"/>

  <!-- Code symbols decoration -->
  <text x="60" y="100" font-family="monospace" font-size="24" fill="rgba(255,255,255,0.3)" font-weight="bold">&lt;/&gt;</text>
  <text x="310" y="100" font-family="monospace" font-size="24" fill="rgba(255,255,255,0.3)" font-weight="bold">{}</text>
  <text x="60" y="300" font-family="monospace" font-size="24" fill="rgba(255,255,255,0.3)" font-weight="bold">AI</text>
  <text x="320" y="300" font-family="monospace" font-size="24" fill="rgba(255,255,255,0.3)" font-weight="bold">ML</text>
</svg>
